name: Push Docker Images

on:
  push:
    tags:
      - "v*"
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to publish, for example class-demo
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-push-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  push:
    name: ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: node-app
            context: node-app
          - app: python-app
            context: python-app
          - app: go-app
            context: go-app
          - app: production-node-app
            context: production-node-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image metadata
        id: meta
        env:
          INPUT_IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          if [ -n "${INPUT_IMAGE_TAG}" ]; then
            image_tag="${INPUT_IMAGE_TAG}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            image_tag="${GITHUB_REF_NAME}"
          else
            image_tag="${GITHUB_SHA::12}"
          fi

          image_base="${REGISTRY}/${GITHUB_REPOSITORY}/${{ matrix.app }}"
          image_base=$(echo "${image_base}" | tr '[:upper:]' '[:lower:]')

          echo "image_tag=${image_tag}" >> "${GITHUB_OUTPUT}"
          echo "image_base=${image_base}" >> "${GITHUB_OUTPUT}"

      - name: Build and push single-stage image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile.single
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.image_base }}:${{ steps.meta.outputs.image_tag }}-single
            ${{ steps.meta.outputs.image_base }}:single
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push multi-stage image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile.multi
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.image_base }}:${{ steps.meta.outputs.image_tag }}-multi
            ${{ steps.meta.outputs.image_base }}:multi
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

