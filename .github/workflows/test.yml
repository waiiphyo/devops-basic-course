name: Test Applications

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-app:
    name: Node app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: node-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Smoke test
        run: |
          npm start &
          app_pid=$!
          trap 'kill "${app_pid}"' EXIT

          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:3000/health; then
              exit 0
            fi
            sleep 1
          done

          exit 1

  python-app:
    name: Python app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile
        run: python -m compileall app

      - name: Smoke test
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          app_pid=$!
          trap 'kill "${app_pid}"' EXIT

          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:8000/health; then
              exit 0
            fi
            sleep 1
          done

          exit 1

  go-app:
    name: Go app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: go-app/go.sum

      - name: Test
        run: go test ./...

      - name: Build
        run: go build -trimpath -ldflags="-w -s" -o /tmp/go-app-server ./cmd/server

      - name: Smoke test
        run: |
          /tmp/go-app-server &
          app_pid=$!
          trap 'kill "${app_pid}"' EXIT

          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:8080/health; then
              exit 0
            fi
            sleep 1
          done

          exit 1

  production-node-app:
    name: Production Node app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: production-node-app

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: appuser
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: myapp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U appuser -d myapp"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: production-node-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Smoke test
        env:
          DATABASE_URL: postgresql://appuser:postgres@127.0.0.1:5432/myapp
          REDIS_URL: redis://127.0.0.1:6379
          JWT_SECRET: ci-secret
        run: |
          npm start &
          app_pid=$!
          trap 'kill "${app_pid}"' EXIT

          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/health; then
              exit 0
            fi
            sleep 1
          done

          exit 1

